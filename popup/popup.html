<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>간편 캡처</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>간편 캡처</h1>
  <div class="list">
    <button data-mode="visible">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      <span class="text"><b>보이는 영역</b><small>지금 화면에 보이는 부분만</small></span>
      <kbd>Alt+Shift+V</kbd>
    </button>
    <button data-mode="full">
      <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h6"/></svg>
      <span class="text"><b>전체 페이지</b><small>스크롤 영역까지 모두</small></span>
      <kbd>Alt+Shift+F</kbd>
    </button>
    <button data-mode="element">
      <svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg>
      <span class="text"><b>요소 선택</b><small>마우스로 요소를 골라 캡처</small></span>
      <kbd>Alt+Shift+E</kbd>
    </button>
    <button data-mode="region">
      <svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>
      <span class="text"><b>영역 지정</b><small>드래그해서 원하는 부분만</small></span>
      <kbd>Alt+Shift+R</kbd>
    </button>
  </div>
  <p id="error" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
